[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "uk-attention-atlas"
version = "0.1.0"
description = "Reproducible UK attention, events and physical-context pilot for T&E"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyarrow>=17,<26",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
bigquery = ["google-cloud-bigquery>=3.38,<4"]
supabase = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
uk-atlas = "climate_attention.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_attention"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
