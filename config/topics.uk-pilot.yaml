schema_version: 1

# Initial English-language seed taxonomy for the UK pilot. These phrases exist to
# estimate and prototype the collection workload. They require T&E review and
# precision/recall validation before research use.
topics:
  climate_change:
    label: Climate change
    enabled: true
    description: Explicit discussion of anthropogenic climate change.
    queries:
      - '"climate change"'
      - '"global warming"'
      - '"climate crisis"'
    ngram_phrases:
      en:
        translation_status: draft
        phrases:
          - climate change
          - global warming
          - climate crisis

  fuel_prices:
    label: Fuel prices
    enabled: true
    description: Road fuel prices, petrol and diesel costs, and pump-price changes.
    queries:
      - '"fuel prices"'
      - '"petrol prices"'
      - '"diesel prices"'
      - '"pump prices"'
      - '"forecourt prices"'
    ngram_phrases:
      en:
        translation_status: draft
        phrases:
          - fuel prices
          - petrol prices
          - diesel prices
          - pump prices
          - forecourt prices

  clean_transport:
    label: Clean transport
    enabled: true
    description: Explicit discussion of low-carbon and sustainable transport.
    queries:
      - '"clean transport"'
      - '"sustainable transport"'
      - '"transport decarbonisation"'
      - '"transport decarbonization"'
      - '"transport emissions"'
      - '"clean mobility"'
      - '"sustainable mobility"'
      - '"low-carbon transport"'
      - '"low emission transport"'
      - '"zero emission transport"'
      - '"transport electrification"'
      - '"active travel"'
      - '"modal shift"'
    ngram_phrases:
      en:
        translation_status: draft
        phrases:
          - clean transport
          - sustainable transport
          - transport decarbonisation
          - transport decarbonization
          - transport emissions
          - clean mobility
          - sustainable mobility
          - low-carbon transport
          - low carbon transport
          - low-emission transport
          - low emission transport
          - zero-emission transport
          - zero emission transport
          - transport electrification
          - active travel
          - modal shift

  electric_vehicles:
    label: Electric vehicles
    enabled: true
    description: Explicit references to electric cars and vehicles.
    queries:
      - '"electric vehicle"'
      - '"electric vehicles"'
      - '"electric car"'
      - '"electric cars"'
      - '"battery electric vehicle"'
      - '"battery electric vehicles"'
      - '"zero emission vehicle"'
      - '"zero emission vehicles"'
    ngram_phrases:
      en:
        translation_status: draft
        phrases:
          - electric vehicle
          - electric vehicles
          - electric car
          - electric cars
          - battery electric vehicle
          - battery electric vehicles
          - zero emission vehicle
          - zero emission vehicles

  extreme_weather:
    label: Extreme weather
    enabled: true
    description: Discussion of extreme-weather events, their impacts, or preparation for them.
    queries:
      - 'flood*'
      - wildfire
      - heatwave
      - storm
      - drought
      - 'extreme cold'
    ngram_phrases:
      en:
        translation_status: draft
        phrases:
          - flood
          - flooding
          - wildfire
          - wildfires
          - heatwave
          - heatwaves
          - storm
          - storms
          - drought
          - droughts
          - extreme cold
