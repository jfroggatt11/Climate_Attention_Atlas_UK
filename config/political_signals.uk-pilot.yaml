schema_version: 1

# The current article-retention query requires a political-signal configuration.
# These UK-only seeds also preserve the existing political-attention capability.
signals:
  political_actor:
    label: Political actor
    description: References to elected institutions, office-holders, or parties.
    phrases:
      en:
        translation_status: draft
        phrases: [government, minister, parliament, prime minister, political party]

  government_action:
    label: Government action
    description: Policy, law, regulation, public spending, targets, bans, or official decisions.
    phrases:
      en:
        translation_status: draft
        phrases: [government policy, climate policy, new law, legislation, regulation, government subsidy, emissions target, government ban]

  party_politics:
    label: Party politics
    description: Electoral competition and named major UK parties.
    phrases:
      en:
        translation_status: draft
        phrases: [governing party, opposition party, election campaign, Labour Party, Conservative Party, Liberal Democrats, Green Party, Reform UK]

official_domains:
  unitedkingdom:
    - gov.uk
    - parliament.uk
    - labour.org.uk
    - conservatives.com
    - libdems.org.uk
    - greenparty.org.uk
    - reformparty.uk

# Identity seeds are candidates for review, not evidence that an article names
# the entity.  Validity dates support historical attribution when aliases change.
entities:
  - entity_id: uk_government
    entity_type: actor
    canonical_name: UK Government
    aliases: [government, ministers, Westminster]
    roles: [executive]
    valid_from: '2010-01-01'
    source_urls: [https://www.gov.uk/]
  - entity_id: labour_party
    entity_type: party
    canonical_name: Labour Party
    aliases: [Labour, Labour Party]
    valid_from: '1900-01-01'
    source_urls: [https://labour.org.uk/]
  - entity_id: conservative_party
    entity_type: party
    canonical_name: Conservative Party
    aliases: [Conservative, Conservatives, Tory, Tories]
    valid_from: '1900-01-01'
    source_urls: [https://conservatives.com/]
  - entity_id: net_zero_policy
    entity_type: policy
    canonical_name: Net zero target
    aliases: [net zero, net-zero target, net zero target]
    valid_from: '2019-01-01'
    source_urls: [https://www.gov.uk/government/news/uk-becomes-first-major-economy-to-pass-net-zero-emissions-law]
