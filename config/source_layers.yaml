schema_version: 1
registry_version: uk-source-layers-v1
layers:
  - {layer_id: desnz_fuel_prices, label: DESNZ road fuel prices, provider: DESNZ, cadence: weekly, geography: GB, units: [pence_per_litre], status: fixture_ready, source_url: https://www.gov.uk/government/collections/road-fuel-prices, access_requirement: public release; confirm revision and licence terms, independence_note: Price series is an external economic context and does not measure attention.}
  - {layer_id: ons_cost_pressures, label: ONS consumer prices, provider: ONS, cadence: monthly, geography: GB, units: [index_2015_100, percent_change], status: fixture_ready, source_url: https://www.ons.gov.uk/economy/inflationandpriceindices, access_requirement: public API/download; confirm series identifiers, independence_note: Official price index; revisions and basket definitions must be retained.}
  - {layer_id: haduk_grid_weather, label: HadUK-Grid weather anomalies, provider: Met Office, cadence: monthly, geography: GB, units: [degrees_celsius, millimetres], status: fixture_ready, source_url: https://www.metoffice.gov.uk/research/climate/maps-and-data, access_requirement: dataset access and licence confirmation, independence_note: Gridded physical conditions are separate from event catalogues and media.}
  - {layer_id: environment_agency_alerts, label: Environment Agency flood alerts, provider: Environment Agency, cadence: event_driven, geography: GB, units: [alert_count], status: fixture_ready, source_url: https://environment.data.gov.uk/, access_requirement: public feed; confirm geography and update semantics, independence_note: Operational alert feed can overlap with media reporting.}
  - {layer_id: rail_disruption, label: Rail disruption and performance, provider: rail operators / ORR, cadence: daily, geography: GB, units: [delay_minutes, cancellation_count], status: fixture_ready, source_url: https://www.orr.gov.uk/, access_requirement: operator or ORR data agreement, independence_note: Operational disruption may be both a news subject and an exposure.}
  - {layer_id: brent_oil, label: Brent crude oil price, provider: public market feed, cadence: daily, geography: market, units: [usd_per_barrel], status: fixture_ready, source_url: https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm, access_requirement: confirm source terms and delayed data, independence_note: Market series is not a direct UK household price measure.}
  - {layer_id: ftse100, label: FTSE 100 index, provider: public market feed, cadence: daily, geography: market, units: [index_points], status: fixture_ready, source_url: https://www.londonstockexchange.com/, access_requirement: confirm licensing before publication, independence_note: Market context is exploratory and not a causal control by default.}
  - {layer_id: local_disruption, label: Local disruption register, provider: T&E / approved local feeds, cadence: event_driven, geography: local_authority, units: [incident_count], status: access_pending, source_url: null, access_requirement: approve local feed inventory and geography mapping, independence_note: "Must distinguish incident location, audience geography and article-mentioned geography."}
  - {layer_id: google_trends_official, label: Official Google Trends search interest, provider: Google, cadence: daily, geography: GB, units: [index_0_100], status: access_pending, source_url: https://developers.google.com/, access_requirement: T&E API access and publication terms, independence_note: Search interest remains separate from news and social measures.}
  - {layer_id: polling_opinion, label: UK climate opinion polling, provider: "BES / YouGov / Ipsos / Greenpeace", cadence: on_demand, geography: GB, units: [percent, sample_size], status: access_pending, source_url: null, access_requirement: "Approve question wording, fieldwork dates, microdata or toplines, weighting and publication rights for BES, YouGov, Ipsos and Greenpeace polls.", independence_note: "Survey responses measure stated public attitudes; poll house, sample, mode, weighting and question wording must remain attached to every observation. Polling is not a behavioural or media-attention measure."}
  - {layer_id: firms_hotspots, label: NASA FIRMS active fires, provider: NASA, cadence: daily, geography: GB, units: [hotspot_count], status: adapter_ready, source_url: https://firms.modaps.eosdis.nasa.gov/, access_requirement: T&E-owned API key for durable refresh, independence_note: "Hotspots are detections, not named events or burned area."}
  - {layer_id: modis_burned_area, label: NASA MODIS MCD64 burned area, provider: NASA, cadence: monthly, geography: GB, units: [hectares], status: adapter_ready, source_url: https://lpdaac.usgs.gov/products/mcd64a1v061/, access_requirement: Earthdata access and processing resources, independence_note: Burned area is separate from FIRMS hotspots and GDACS events.}
